<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="container">
        <canvas id="screen"></canvas>
        <!-- brush rings: outside #hud, so they stay visible when Esc hides the UI -->
        <svg id="wall-overlay" aria-hidden="true">
            <g id="geysers"></g>
            <g id="geyser-aim" style="display:none"><line class="geyser-tick"/><line class="geyser-tick in"/><text class="geyser-aim-label"/></g>
            <line id="wall-line"/>
            <circle id="force-ring" class="ring force"/>
            <circle id="wall-ring" class="ring"/>
        </svg>

        <div id="hud" class="hidden">
            <!-- top: view selector -->
            <div id="view-select">
            <button id="view-btn" aria-haspopup="listbox">
                <svg viewBox="0 0 240 38" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0 0 H240 C226 0 222 38 206 38 H34 C18 38 14 0 0 0 Z"/>
                </svg>
                <span class="label"><b id="view-name">dye</b><i>▼</i></span>
            </button>
            <ul id="view-list" hidden></ul>
            </div>

            <!-- left: tool rail -->
            <nav id="tools"></nav>

            <!-- right: inspector -->
            <aside id="inspector">
            <div id="insp-resize" title="Drag to resize"></div>
            <!-- small screens: slides the inspector out of / back into view -->
            <button id="insp-tab" title="Hide inspector">›</button>
            <header><span>INSPECTOR</span>
            <div class="hbtns">
                <button id="insp-reset" title="Reset all to defaults">
                <svg viewBox="0 0 24 24"><path d="M15.5 5.94A7 7 0 1 1 8.5 5.94"/><path d="M7.02 9.11L8.5 5.94L5.01 5.64"/></svg>
                </button>
                <button id="insp-toggle" title="Collapse">–</button>
            </div>
            </header>
            <div id="insp-body"></div>
            </aside>

            <!-- world coordinates on the screen edges -->
            <div class="corner tl" id="c-tl"></div>
            <div class="corner tr" id="c-tr"></div>
            <div class="corner bl" id="c-bl"></div>
            <div class="corner br" id="c-br"></div>

            <footer id="status"><span id="st-cursor">x — y —</span><span id="st-tool"></span><button id="st-fullscreen" type="button">enter fullscreen</button><span id="st-fps"></span></footer>
        </div>
    </div>
    
    <script src="bundle/index.min.js"></script>
</body>
</html>

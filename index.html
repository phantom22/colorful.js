<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: black;
}

#container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}

#screen {
    display: block;
    width: 100%;
    height: 100%;
}

#color-picker {
    position: absolute;
    right: 2%;
    top: 50%;
    transform: translateY(-50%);
    width: 6.538%;
    
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0px;
    background: transparent;
    border: none;
    outline: 1px solid white;
    box-sizing: border-box;
}

#color-picker button {
    width: 100%;
    aspect-ratio: 1 / 1;
    font-weight: bold;
    border: none;
    padding: 0;
    cursor: pointer;
    display: block;
    border: none;
    outline: 1px solid transparent;
    
    box-shadow: 
        0 4px 6px -1px rgba(0, 0, 0, 0.15), 
        0 2px 4px -2px rgba(0, 0, 0, 0.1);

    transition:
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        outline 0.25s cubic-bezier(0, 0, 0.9, 0.1),
        z-index 0s linear 0.25s;
}

#color-picker button:not(.picked):hover {
    transform: scale(1.15);
    z-index: 5;

    box-shadow: 
        0 16px 24px -2px rgba(0, 0, 0, 0.25), 
        0 6px 12px -4px rgba(0, 0, 0, 0.18);

    outline: 1px solid white;

    transition:
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        outline-color 0s linear 0s,
        z-index 0s linear 0s;
}

#color-picker button.picked {
    z-index: 10;

    box-shadow: 
        0 28px 36px -4px rgba(0, 0, 0, 0.38), 
        0 12px 18px -6px rgba(0, 0, 0, 0.25);

    outline: 1px solid white;
}

#info-curtain {
    visibility: hidden;
    position:absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.2);
    margin: 0;
    z-index: 1;
}

#esc-button {
    visibility: visible;
    transition: filter 0.12s ease;
    cursor: pointer;
}

#esc-button:hover {
    filter: brightness(1.5);
}

#esc-button {
    visibility: visible;
}

#info-curtain .top-shortcuts {
    position: absolute;
    top: 1%;
    left: 1%;
    z-index: 2;
}

#info-curtain .bottom-shortcuts {
    position: absolute;
    bottom: 1%;
    left: 1%;
    z-index: 2;
}

.shortcut-container {
    display: grid;
    grid-template-columns: auto 1fr; 
    align-items: center; 
    justify-items: center;
    column-gap: 4px; 
    row-gap: 0; 
    box-sizing: border-box;

    width: 35.59%;

    padding: 12px 16px;              /* Uniform internal spacing */
    border-radius: 6px;               /* Slightly rounded corners matching key shapes */
    background-color: #1e1e1e;        /* Dark card background */
    border: 1px solid #333333;        /* Subtle outer border */
}

.shortcut-container p {
    text-align: left;
    justify-self: start;
    font-family: Didot, "Bodoni MT", "Cinzel", serif;
    text-transform: uppercase;
    color: white;
    margin: 0; 
}

.shortcut-container img {
    display: block;
    height: auto;
}

.shortcut-title {
    grid-column: 1 / -1;
    justify-self: center;
    margin: 0;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3.5px;
    color: #f97316;
}

.shortcut-divider {
    grid-column: 1 / -1;
    width: 100%;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.1);
    margin: 2px 0 6px 0;
}
</style>
</head>
<body>
    <div id="container">
        <canvas id="screen"></canvas>
        <div id="color-picker"></div>
        <div id="info-curtain">
            <div class="shortcut-container top-shortcuts">
                <h4 class="shortcut-title">General</h4>
                <div class="shortcut-divider"></div>
                <img id="esc-button" src="img/esc.png" alt="Esc">
                <p>to toggle this menu</p>
                <img src="img/p.png" alt="P">
                <p>to start an inward wave</p>
                <img src="img/c.png" alt="C">
                <p>to clear the sandbox</p>
            </div>
            <div class="shortcut-container bottom-shortcuts">
                <h4 class="shortcut-title">While drawing</h4>
                <div class="shortcut-divider"></div>
                <img src="img/ctrl.png" alt="Ctrl">
                <p>to queue brush strokes</p>
                <img src="img/shift.png" alt="Shift">
                <p>to fill the entire grid</p>
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
<script type="x-shader/vs" id="vertex-shader">
#version 300 es
layout(location = 0) in vec2 pos;
layout(location = 1) in uint id;

uniform mat4 u_view_proj;
flat out uint v_id;

out vec2 v_local_pos;

void main() {
    v_local_pos = pos;

    v_id = id;
    gl_Position = u_view_proj * vec4(pos, 0.0, 1.0);
}
</script>
<script type="x-shader/fs" id="fragment-shader">
#version 300 es
precision mediump float;

flat in uint v_id;
in vec2 v_local_pos;

uniform sampler2D u_texture;
uniform float u_texture_size;

out vec4 color;

void main() {
    float id = float(v_id);

    float col = mod(id, u_texture_size);
    float row = floor(id / u_texture_size);

    vec2 uv = vec2((col + 0.5) / u_texture_size, (row + 0.5) / u_texture_size);

    vec2 p = abs(v_local_pos);
    float max_dist = max(p.x * 0.8660254 + p.y * 0.5, p.y);

    if (max_dist > 0.86235) {
        color = vec4(1.0, 1.0, 1.0, 1.0);
    }
    else {  
        color = texture(u_texture, uv);
    }
}
</script>
<script type="x-shader/vs" id="mask-vertex">
#version 300 es
layout(location = 0) in vec2 pos;
layout(location = 1) in uint id;

uniform mat4 u_view_proj;

flat out uint v_id;

void main() {
    v_id = id;
    gl_Position = u_view_proj * vec4(pos, 0.0, 1.0);
}
</script>
<script type="x-shader/fs" id="mask-fragment">
#version 300 es
precision highp float;
precision highp int;

flat in uint v_id;

out uint color;

void main() {
    color = v_id;
}
</script>
</body>
</html>

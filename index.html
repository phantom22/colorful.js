<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: black;
}

#container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}

#screen {
    display: block;
    width: 100%;
    height: 100%;
}

#color-picker {
    position: absolute;
    right: 2%;
    top: 50%;
    transform: translateY(-50%);
    width: 6.538%;
    
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0px;
    background: transparent;
    border: none;
    outline: 1px solid white;
    box-sizing: border-box;
}

#color-picker button {
    width: 100%;
    aspect-ratio: 1 / 1;
    font-weight: bold;
    border: none;
    padding: 0;
    cursor: pointer;
    display: block;
    border: none;
    outline: 1px solid transparent;
    font-size: 1.3em;
    overflow: hidden;

    transition:
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        outline 0.25s cubic-bezier(0, 0, 0.9, 0.1),
        z-index 0s linear 0.25s;
}

#color-picker button:not(.picked):hover {
    transform: scale(1.15);
    z-index: 5;

    outline: 1px solid white;

    transition:
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        outline-color 0s linear 0s,
        z-index 0s linear 0s;
}

#color-picker button.picked {
    z-index: 10;
    outline: 1px solid white;
}

#menu {
    visibility: hidden;
    position:absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.2);
    margin: 0;
    z-index: 1;
    user-select: none;
}

#esc-button {
    visibility: visible;
    transition: filter 0.12s ease;
    cursor: pointer;
}

#esc-button:hover {
    filter: brightness(1.5);
}

#esc-button {
    visibility: visible;
}

#menu .top-shortcuts {
    position: absolute;
    top: 1%;
    left: 1%;
    z-index: 2;
}

#menu .bottom-shortcuts {
    position: absolute;
    bottom: 1%;
    left: 1%;
    z-index: 2;
}

.shortcut-container {
    display: grid;
    grid-template-columns: auto 1fr; 
    align-items: center; 
    justify-items: center;
    column-gap: 4px; 
    row-gap: 0; 
    box-sizing: border-box;

    width: 35.59%;

    padding: 12px 16px;
    border-radius: 6px;
    background-color: #1e1e1e;
    border: 1px solid #333333;
}

.shortcut-container p {
    text-align: left;
    justify-self: start;
    font-family: Didot, "Bodoni MT", "Cinzel", serif;
    text-transform: uppercase;
    color: white;
    margin: 0; 
}

.shortcut-container img {
    display: block;
    height: auto;
}

.shortcut-title {
    grid-column: 1 / -1;
    justify-self: center;
    margin: 0;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3.5px;
    color: #f97316;
}

.shortcut-divider {
    grid-column: 1 / -1;
    width: 100%;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.1);
    margin: 2px 0 6px 0;
}
</style>
</head>
<body>
    <div id="container">
        <canvas id="screen"></canvas>
        <div id="color-picker"></div>
        <div id="menu">
            <div class="shortcut-container top-shortcuts">
                <h4 class="shortcut-title">General</h4>
                <div class="shortcut-divider"></div>
                <img id="esc-button" src="img/esc.png" alt="Esc">
                <p>to toggle this menu</p>
                <img src="img/p.png" alt="P">
                <p>to start an inward wave</p>
                <img src="img/c.png" alt="C">
                <p>to clear the sandbox</p>
            </div>
            <div class="shortcut-container bottom-shortcuts">
                <h4 class="shortcut-title">While drawing</h4>
                <div class="shortcut-divider"></div>
                <img src="img/ctrl.png" alt="Ctrl">
                <p>to queue brush strokes</p>
                <img src="img/shift.png" alt="Shift">
                <p>to fill the entire grid</p>
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
<script type="x-shader/vs" id="vertex-shader">
#version 300 es
layout(location = 0) in vec2 pos;
layout(location = 1) in uint id;
layout(location = 2) in vec2 uv;
layout(location = 3) in vec2 adj_uv1;
layout(location = 4) in vec2 adj_uv2;
layout(location = 5) in vec2 adj_uv3;
layout(location = 6) in uint hovered;

uniform mat4 u_view_proj;

flat out uint v_id;
out vec2 v_uv;
out vec2 v_adj_uv1;
out vec2 v_adj_uv2;
out vec2 v_adj_uv3;
flat out uint v_hovered;
out vec2 v_local_pos;

void main() {
    v_local_pos = pos;
    v_id = id;
    v_uv = uv;
    v_adj_uv1 = adj_uv1;
    v_adj_uv2 = adj_uv2;
    v_adj_uv3 = adj_uv3;
    v_hovered = hovered;
    gl_Position = u_view_proj * vec4(pos, 0.0, 1.0);
}
</script>
<script type="x-shader/fs" id="fragment-shader">
#version 300 es
precision highp float;
precision highp sampler2D;

flat in uint v_id;
in vec2 v_uv;
in vec2 v_adj_uv1;
in vec2 v_adj_uv2;
in vec2 v_adj_uv3;
flat in uint v_hovered;
in vec2 v_local_pos;

uniform sampler2D u_texture;
uniform sampler2D u_state_weights;
uniform sampler2D u_wcolor_dist;
uniform highp float u_delta_time;

out vec4 o_color;

void main() {
    vec2 p = abs(v_local_pos);
    float max_dist = max(p.x * 0.8660254 + p.y * 0.5, p.y);

    if (max_dist > 0.86235) {
        o_color = vec4(1.0, 1.0, 1.0, 1.0);
    }
    else {  
        o_color = texture(u_texture, v_uv);
    }
}
</script>
<script type="x-shader/vs" id="state-vertex">
#version 300 es
layout(location = 0) in uint id;
layout(location = 1) in vec2 uv;
layout(location = 2) in vec2 adj_uv1;
layout(location = 3) in vec2 adj_uv2;
layout(location = 4) in vec2 adj_uv3;

flat out uint v_id;
out vec2 v_uv;
out vec2 v_adj_uv1;
out vec2 v_adj_uv2;
out vec2 v_adj_uv3;

void main() {
    v_id = id;
    v_uv = uv;
    v_adj_uv1 = adj_uv1;
    v_adj_uv2 = adj_uv2;
    v_adj_uv3 = adj_uv3;

    gl_Position = vec4(v_uv * 2.0 - 1.0, 0.0, 1.0);
    gl_PointSize = 1.0;
}
</script>
<script type="x-shader/fs" id="state-frag">
#version 300 es
precision highp float;
precision highp sampler2D;

flat in uint v_id;
in vec2 v_uv;
in vec2 v_adj_uv1;
in vec2 v_adj_uv2;
in vec2 v_adj_uv3;

uniform sampler2D u_texture;
uniform sampler2D u_state_weights;
uniform sampler2D u_wcolor_dist;
uniform highp float u_delta_time;

layout(location = 0) out highp vec4 o_state_weights;
layout(location = 1) out highp vec4 o_wcolor_dist;

void main() {
    vec4 state_weights = texture(u_state_weights, v_uv);

    //int from = 0;
    //float from_state = this_state;
    //float s1 = texture(u_state_weights, v_adj_uv1).x;
    //float s2 = texture(u_state_weights, v_adj_uv2).x;
    //if (from_state < s1) {
    //    from = 1;
    //    from_state = s1;
    //}
    //if (from_state < s2) {
    //    from = 2;
    //    from_state = s2;
    //}
    //if (v_adj_uv3.x < 0.0) {
    //    float s3 = texture(u_state_weights, v_adj_uv3).x;
    //    if (from_state < s3) {
    //        from = 3;
    //        from_state = s3;
    //    }
    //}
    
    float state = state_weights.r + u_delta_time * 0.1;
    vec3 weights = vec3(0.0, 0.0, 0.0);
    o_state_weights = vec4(state, state_weights.gba);

    vec3 original_color = texture(u_texture, v_uv).xyz;
    vec4 wcolor_dist = texture(u_wcolor_dist, v_uv);
    vec3 wcolor = wcolor_dist.xyz;
    float distance = wcolor_dist.w;
    o_wcolor_dist = vec4(original_color + wcolor, distance);
}
</script>
<script type="x-shader/vs" id="mask-vertex">
#version 300 es
layout(location = 0) in vec2 pos;
layout(location = 1) in uint id;

uniform mat4 u_view_proj;

flat out uint v_id;

void main() {
    v_id = id;
    gl_Position = u_view_proj * vec4(pos, 0.0, 1.0);
}
</script>
<script type="x-shader/fs" id="mask-fragment">
#version 300 es
precision highp float;
precision highp int;

flat in uint v_id;

out uint o_color;

void main() {
    o_color = v_id;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colorful</title>
<style>
html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: black;
}

#container {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
}

#screen {
    display: block;
    width: 100%;
    height: 100%;
}

#color-picker {
    position: absolute;
    right: 2%;
    top: 50%;
    transform: translateY(-50%);
    width: 6.538%;
    
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0px;
    background: transparent;
    border: none;
    outline: 1px solid white;
    box-sizing: border-box;
}

#color-picker button {
    width: 100%;
    aspect-ratio: 1 / 1;
    font-weight: bold;
    border: none;
    padding: 0;
    cursor: pointer;
    display: block;
    border: none;
    outline: 1px solid transparent;
    font-size: 1.3em;
    overflow: hidden;

    transition:
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        outline 0.25s cubic-bezier(0, 0, 0.9, 0.1),
        z-index 0s linear 0.25s;
}

#color-picker button:not(.picked):hover {
    transform: scale(1.15);
    z-index: 5;

    outline: 1px solid white;

    transition:
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        outline-color 0s linear 0s,
        z-index 0s linear 0s;
}

#color-picker button.picked {
    z-index: 10;
    outline: 1px solid white;
}

#menu {
    visibility: hidden;
    position:absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,255,255,0.2);
    margin: 0;
    z-index: 1;
    user-select: none;
}

#esc-button {
    visibility: visible;
    transition: filter 0.12s ease;
    cursor: pointer;
}

#esc-button:hover {
    filter: brightness(1.5);
}

#esc-button {
    visibility: visible;
}

#menu .top-shortcuts {
    position: absolute;
    top: 1%;
    left: 1%;
    z-index: 2;
}

#menu .bottom-shortcuts {
    position: absolute;
    bottom: 1%;
    left: 1%;
    z-index: 2;
}

.shortcut-container {
    display: grid;
    grid-template-columns: auto 1fr; 
    align-items: center; 
    justify-items: center;
    column-gap: 4px; 
    row-gap: 0; 
    box-sizing: border-box;

    width: 35.59%;

    padding: 12px 16px;
    border-radius: 6px;
    background-color: #1e1e1e;
    border: 1px solid #333333;
}

.shortcut-container p {
    text-align: left;
    justify-self: start;
    font-family: Didot, "Bodoni MT", "Cinzel", serif;
    text-transform: uppercase;
    color: white;
    margin: 0; 
}

.shortcut-container img {
    display: block;
    height: auto;
}

.shortcut-title {
    grid-column: 1 / -1;
    justify-self: center;
    margin: 0;
    font-size: 0.7rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3.5px;
    color: #f97316;
}

.shortcut-divider {
    grid-column: 1 / -1;
    width: 100%;
    height: 1px;
    background-color: rgba(255, 255, 255, 0.1);
    margin: 2px 0 6px 0;
}
</style>
</head>
<body>
    <div id="container">
        <canvas id="screen"></canvas>
        <div id="color-picker"></div>
        <div id="menu">
            <div class="shortcut-container top-shortcuts">
                <h4 class="shortcut-title">General</h4>
                <div class="shortcut-divider"></div>
                <img id="esc-button" src="img/esc.png" alt="Esc">
                <p>to toggle this menu</p>
                <img src="img/p.png" alt="P">
                <p>to start an inward wave</p>
                <img src="img/c.png" alt="C">
                <p>to clear the sandbox</p>
            </div>
            <div class="shortcut-container bottom-shortcuts">
                <h4 class="shortcut-title">While drawing</h4>
                <div class="shortcut-divider"></div>
                <img src="img/ctrl.png" alt="Ctrl">
                <p>to queue brush strokes</p>
                <img src="img/shift.png" alt="Shift">
                <p>to fill the entire grid</p>
            </div>
        </div>
    </div>
    <script src="js/index.js"></script>
<script type="x-shader/vs" id="gpu-vert">
#version 300 es
layout(location = 0) in vec2 pos;
layout(location = 1) in uint id;
layout(location = 2) in vec2 uv;
layout(location = 3) in vec2 adj_uv1;
layout(location = 4) in vec2 adj_uv2;
layout(location = 5) in vec2 adj_uv3;
layout(location = 6) in uint hovered;

uniform mat4 u_view_proj;

flat out uint v_id;
out vec2 v_uv;
out vec2 v_adj_uv1;
out vec2 v_adj_uv2;
out vec2 v_adj_uv3;
flat out uint v_hovered;
out vec2 v_local_pos;

void main() {
    v_local_pos = pos;
    v_id = id;
    v_uv = uv;
    v_adj_uv1 = adj_uv1;
    v_adj_uv2 = adj_uv2;
    v_adj_uv3 = adj_uv3;
    v_hovered = hovered;
    gl_Position = u_view_proj * vec4(pos, 0.0, 1.0);
}
</script>
<script type="x-shader/fs" id="gpu-frag">
#version 300 es
precision highp float;
precision highp sampler2D;

flat in uint v_id;
in vec2 v_uv;
in vec2 v_adj_uv1;
in vec2 v_adj_uv2;
in vec2 v_adj_uv3;
flat in uint v_hovered;
in vec2 v_local_pos;

uniform sampler2D u_texture;
uniform sampler2D u_state_weights;
uniform sampler2D u_wcolor_dist;

uniform float u_blend_value;
uniform float u_wave_decay;
uniform float u_decay_min_radius;
uniform float u_delta_time;
uniform float u_max_weight;
//uniform float u_wave_id;

out vec4 o_color;

void main() {
    vec2 p = abs(v_local_pos);
    float max_dist = max(p.x * 0.8660254 + p.y * 0.5, p.y);
    if (max_dist > 0.86235) {
        o_color = vec4(1.0, 1.0, 1.0, 1.0);
        return;
    }

    vec3 original_color = texture(u_texture, v_uv).rgb;
    float state = texture(u_state_weights, v_uv).r;

    vec4 wcolor_dist = texture(u_wcolor_dist, v_uv);
    vec3 wave_color = wcolor_dist.rgb;
    float distance = wcolor_dist.a;

    float decay_factor = u_blend_value * pow(u_wave_decay, max(distance - u_decay_min_radius - 1.0, 0.0));
    decay_factor = clamp(decay_factor, 0.0, 1.0);

    float state_ramp = smoothstep(0.0, 0.5 * u_max_weight, state);

    float factor = state_ramp;
    o_color = vec4(mix(original_color, wave_color, factor), 1.0);

    if (v_hovered == 1u)
        o_color = vec4((o_color.rgb + vec3(1.0)) * 0.5, 1.0);

    //o_color = vec4(texture(u_state_weights,v_uv).rrr/u_wave_id, 1.0);
}
</script>

<script type="x-shader/fs" id="cpu-frag">
#version 300 es
precision highp float;
precision highp sampler2D;

flat in uint v_id;
in vec2 v_uv;
in vec2 v_local_pos;

uniform sampler2D u_texture;

out vec4 o_color;

void main() {
    vec2 p = abs(v_local_pos);
    float max_dist = max(p.x * 0.8660254 + p.y * 0.5, p.y);

    if (max_dist > 0.86235) {

<script type="x-shader/vs" id="state-vert">
#version 300 es
layout(location = 0) in uint id;
layout(location = 1) in vec2 uv;
layout(location = 2) in vec2 adj_uv1;
layout(location = 3) in vec2 adj_uv2;
layout(location = 4) in vec2 adj_uv3;

flat out uint v_id;
out vec2 v_uv;
out vec2 v_adj_uv1;
out vec2 v_adj_uv2;
out vec2 v_adj_uv3;

void main() {
    v_id = id;
    v_uv = uv;
    v_adj_uv1 = adj_uv1;
    v_adj_uv2 = adj_uv2;
    v_adj_uv3 = adj_uv3;

    gl_Position = vec4(v_uv * 2.0 - 1.0, 0.0, 1.0);
    gl_PointSize = 1.0;
}
</script>
<script type="x-shader/fs" id="state-frag">
#version 300 es
precision highp float;
precision highp sampler2D;

flat in uint v_id;
in vec2 v_uv;
in vec2 v_adj_uv1;
in vec2 v_adj_uv2;
in vec2 v_adj_uv3;

uniform sampler2D u_state_weights;
uniform sampler2D u_wcolor_dist;
uniform highp float u_delta_time;
uniform highp float u_max_weight; 
//uniform highp float u_blend_value;
//uniform highp float u_wave_decay;

layout(location = 0) out highp vec4 o_state_weights;
layout(location = 1) out highp vec4 o_wcolor_dist;

const float STATE_RATE = 50.0;
const float WEIGHT_DECAY = 5.0;  // higher = memory fades faster; ~1/WEIGHT_DECAY sec time-constant
const float DIFFUSION_RATE = 300.0; // tune: higher = faster global convergence

void main() {
    bool has_third = v_adj_uv3.x >= 0.0;

    float this_state  = texture(u_state_weights, v_uv).r;
    float this_weight = texture(u_state_weights, v_uv).g;

    float s1 = texture(u_state_weights, v_adj_uv1).r;
    float s2 = texture(u_state_weights, v_adj_uv2).r;
    float s3 = has_third ? texture(u_state_weights, v_adj_uv3).r : 0.0;

    float nw1 = texture(u_state_weights, v_adj_uv1).g;
    float nw2 = texture(u_state_weights, v_adj_uv2).g;
    float nw3 = has_third ? texture(u_state_weights, v_adj_uv3).g : 0.0;

    float a1 = max(s1 - this_state, 0.0);
    float a2 = max(s2 - this_state, 0.0);
    float a3 = has_third ? max(s3 - this_state, 0.0) : 0.0;
    float total = a1 + a2 + a3;

    float w1, w2, w3;
    if (total > 0.0) {
        w1 = a1 / total; w2 = a2 / total; w3 = a3 / total;
    } else {
        float n = has_third ? 3.0 : 2.0;
        w1 = 1.0 / n; w2 = 1.0 / n; w3 = has_third ? 1.0 / n : 0.0;
    }

    float from_state = max(this_state, max(s1, s2));
    if (has_third) from_state = max(from_state, s3);
    float new_state = from_state - (from_state - this_state) * exp(-STATE_RATE * u_delta_time);

    vec4 self_wd = texture(u_wcolor_dist, v_uv);
    vec4 wd1 = texture(u_wcolor_dist, v_adj_uv1);
    vec4 wd2 = texture(u_wcolor_dist, v_adj_uv2);
    vec4 wd3 = has_third ? texture(u_wcolor_dist, v_adj_uv3) : vec4(0.0);

    float decayed_weight = this_weight * exp(-WEIGHT_DECAY * u_delta_time);

    vec3 propagated_color;
    float new_distance;
    float new_weight;

    if (total > 0.0) {
        vec3 incoming_color = w1 * wd1.rgb + w2 * wd2.rgb + w3 * wd3.rgb;
        float incoming_weight = total * u_delta_time;
        float blend_total = decayed_weight + incoming_weight;

        propagated_color = (self_wd.rgb * decayed_weight + incoming_color * incoming_weight) / max(blend_total, 1e-5);
        
        float catch_up_progress = clamp((new_state - this_state) / max(from_state - this_state, 1e-5), 0.0, 1.0);
        float neighbor_distance = w1 * wd1.a + w2 * wd2.a + w3 * wd3.a;
        new_distance = self_wd.a + catch_up_progress * ((neighbor_distance + 1.0) - self_wd.a);

        //new_distance = floor(w1 * wd1.a + w2 * wd2.a + w3 * wd3.a + 1.0 + 0.5);
        new_weight = min(blend_total, u_max_weight);
    } else {
        propagated_color = self_wd.rgb;
        new_distance = self_wd.a;
        new_weight = this_weight;
    }

    // unconditional diffusion pass — always runs, driven by neighbor weight
    // (not state advantage), so it actively mixes at the frontier where
    // advantage is near zero, but doesn't dilute low-weight/fresh neighbors
    float diffuse_total = nw1 + nw2 + nw3;
    vec3 diffuse_target = diffuse_total > 0.0
        ? (nw1 * wd1.rgb + nw2 * wd2.rgb + nw3 * wd3.rgb) / diffuse_total
        : propagated_color;

    float diffusion_amount = clamp(DIFFUSION_RATE * u_delta_time, 0.0, 1.0);
    vec3 new_wcolor = mix(propagated_color, diffuse_target, diffusion_amount);

    o_wcolor_dist   = vec4(new_wcolor, new_distance);
    o_state_weights = vec4(new_state, new_weight, 0.0, 0.0);
}
</script>
